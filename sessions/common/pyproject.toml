[project]
name = "course-common"
version = "0.1.0"
description = "Shared helpers for the Generative AI course sessions"
requires-python = ">=3.10"
dependencies = ["openai==3.41.0", "anthropic==2.3.0", "python-dotenv==1.2.4", "pydantic==2.14.1",
                "ipykernel==7.4.0"]  # lets VS Code run the # %% cells (Run Cell)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["llm", "coursetest"]
